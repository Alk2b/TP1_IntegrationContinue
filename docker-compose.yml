services:
  app:
    image: ghcr.io/${GHCR_USER}/todo-api:${APP_VERSION}
    restart: unless-stopped
    env_file: .env
    networks:
      - todo-net
    volumes:
      - todo-data:/var/lib/todo-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - todo-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

networks:
  todo-net:
    driver: bridge

volumes:
  todo-data: